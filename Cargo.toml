[package]
name = "mav-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Format generated dialects so Go to Definition avoids multi-million-character lines.
mavlink = { version = "=0.19.1", default-features = false, features = ["tokio", "transport-tcp", "transport-udp", "dialect-common", "dialect-ardupilotmega", "mav2-message-extensions", "format-generated-code"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.2"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["full"] }
chrono = "0.4.45"
tokio-util = "0.7.20"
futures = "0.3.34"
futures-timer = "3.0.4"
strum = "0.28.0"

[dev-dependencies]
serde_json = "1"
